# Mirrors new versions' zips to releases `<id>@<version>` and publishes the signed index as the
# assets of release `index`. Also runs hourly: merges made by auto-merge (GITHUB_TOKEN) don't
# start push workflows.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mirror packages and publish the index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INDEX_KEY: ${{ secrets.INDEX_KEY }}
        run: python3 -I tools/registry/publish.py
